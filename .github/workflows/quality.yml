name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Build package
        run: python -m build
      - name: Verify wheel contents
        run: python -m zipfile --list dist/*.whl
      - name: Smoke-test installed metadata
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -c "from importlib.metadata import version; assert version('quakeimagery') == '0.1.0'"
      - name: Validate repository artifacts
        run: python tools/validate_repository.py
