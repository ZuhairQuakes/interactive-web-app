<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">QuakeImagery live earthquake map</title>
  <desc id="description">A stylised world map with earthquake markers and an invitation to open the interactive USGS map.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10243d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="600" cy="335" r="390" fill="url(#glow)"/>

  <g fill="none" stroke="#9fb4cb" stroke-opacity=".13" stroke-width="1">
    <path d="M0 210H1200M0 315H1200M0 420H1200"/>
    <path d="M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630"/>
  </g>

  <g fill="#9fb4cb" fill-opacity=".24" stroke="#c8d7e7" stroke-opacity=".24" stroke-width="2">
    <path d="M92 201l63-46 90-13 51 34 62 3 45 37-18 42-51 24-31 53-41 8-20-42-64-29-58-4-48-34z"/>
    <path d="M341 347l47 32 17 62-23 71-39 56-25-32 7-66-22-61z"/>
    <path d="M492 178l43-27 56 12 21 29-18 27-49 5-39-19z"/>
    <path d="M532 240l61-9 54 28 47-15 47 24 52-13 70 31-16 40-69 7-31 35-60-14-25 34-44-18-21-57-48-16z"/>
    <path d="M586 315l57 25 30 62-26 91-39 35-33-60-14-89z"/>
    <path d="M865 417l55-26 57 25 29 47-47 39-73-17z"/>
    <path d="M1014 320l29-14 22 17-20 21z"/>
  </g>

  <g stroke="#fff" stroke-opacity=".82" stroke-width="3">
    <circle cx="254" cy="248" r="11" fill="#fbbf24"/>
    <circle cx="322" cy="438" r="8" fill="#38bdf8"/>
    <circle cx="544" cy="228" r="9" fill="#38bdf8"/>
    <circle cx="632" cy="354" r="13" fill="#fb7185"/>
    <circle cx="763" cy="314" r="10" fill="#fbbf24"/>
    <circle cx="832" cy="343" r="7" fill="#38bdf8"/>
    <circle cx="908" cy="456" r="12" fill="#fb7185"/>
    <circle cx="1028" cy="345" r="9" fill="#fbbf24"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="58" y="52" width="652" height="142" rx="20" fill="#0a1321" fill-opacity=".94" stroke="#94a3b8" stroke-opacity=".25"/>
    <text x="88" y="91" fill="#38bdf8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">QUAKEIMAGERY · LIVE USGS DATA</text>
    <text x="88" y="137" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="750">Explore recent earthquakes</text>
    <text x="88" y="173" fill="#a9b7ca" font-family="Inter, Arial, sans-serif" font-size="21">Pan · zoom · filter magnitude · inspect events</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="838" y="534" width="304" height="58" rx="29" fill="#0ea5e9"/>
    <text x="990" y="571" fill="#fff" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="750">Open interactive map →</text>
  </g>
</svg>
